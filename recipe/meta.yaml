{% set name = "squarify" %}
{% set version = "0.4.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b8a110c8dc5f1cd1402ca12d79764a081e90bfc445346cfa166df929753ecb46

build:
  number: 0
  skip: true # [py<=38 or py>312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    # Note this isn't explicitly called out in setup.py but matplotlib is imported
    # https://github.com/laserson/squarify/blob/42e332c9c69146fcb3bda44c1d3cc3009955327c/squarify/__init__.py#L222
    - matplotlib-base

test:
  source_files:
    tests
  imports:
    - squarify
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vv tests

about:
  home: https://github.com/laserson/squarify
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: Pure Python implementation of the squarify treemap layout algorithm
  description: |
    The helper functions will compute the normalized values, and could generate a Matplotlib-based
    treemap visualization of your data
  doc_url: https://github.com/laserson/squarify
  dev_url: https://github.com/laserson/squarify

extra:
  recipe-maintainers:
    - aaronmussig
